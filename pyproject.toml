[project]
name = "tmc"
version = "0.1.0"
description = "Toxicogenomic miRNA-target coherence audit"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "matplotlib>=3.8", "statsmodels>=0.14", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
